# Eingabe-Mapping: Taste -> Action
# F-Tasten entfernt — PXN sendet F1/F5 über Keyboard-Interface und würde sonst
# ungewollt Modi auslösen. Steuerung ausschließlich über BTN-Codes (Gamepad-Interface).

[devices]
include = ["*"]
exclude = ["GolfCar D-Pad"]  # Virtuelles uinput-Gerät von DPadRemap ausschließen

# ── PXN-CB1 Buttonboard — 10 Tasten (BTN-Codes von event7) ───────────────
# Nicht auf dem Board, aber über scripts/kittctl <modus> erreichbar: news, viz_crt, viz_eye,
# planeten, menu (altes Hauptmenü), status.
[[bindings]]
key    = "BTN_MISC"
action = "home"       # Taste 1 (HANDLE): Startbildschirm Space-Taxi

[[bindings]]
key    = "BTN_1"
action = "viz_psychedelic"   # Taste 2 (CRUISE): Navigationscomputer

[[bindings]]
key    = "BTN_2"
action = "blackhole"  # Taste 3 (FLASH): Schwarzes Loch

[[bindings]]
key    = "BTN_3"
action = "hal"        # Taste 4 (AUDIO): HAL 3000; BIBO weiter über scripts/kittctl droid

[[bindings]]
key    = "BTN_4"
action = "slots"      # Taste 5 (WIPERS): Space-Slotmaschine

[[bindings]]
key    = "BTN_5"
action = "campfire"   # Taste 6 (MAP): Lagerfeuer

[[bindings]]
key    = "BTN_6"
action = "error"      # Taste 7 (LIGHT): Systemfehler-Visualizer

[[bindings]]
key    = "BTN_7"
action = "gaming"     # Taste 8 (E-TALK): RetroPie / Holo-Arcade

[[bindings]]
key    = "BTN_8"
action = "quit"       # Taste 9: Launcher beenden (nur mit dev_emergency_exit)

[[bindings]]
key    = "BTN_9"
action = "kitt"       # Taste 10: Bordcomputer (Sprachassistent)

# ── Sprechtaste für HAL 3000 (Musik leise + Mikrofon an, nochmal drücken = zurück) ──
# Den HID-Code der gewünschten Taste eintragen (Log des Launchers zeigt unbekannte Codes), z. B.:
# [[bindings]]
# code   = 268
action = "talk"

# ── Cherry-Tastatur ESC (Entwicklung/Notfall) ──────────────────────────
[[bindings]]
key    = "KEY_ESC"
action = "quit"
