# Eingabe-Mapping: Taste -> Action
# F-Tasten entfernt — PXN sendet F1/F5 über Keyboard-Interface und würde sonst
# ungewollt Modi auslösen. Steuerung ausschließlich über BTN-Codes (Gamepad-Interface).

[devices]
include = ["*"]
exclude = []

# ── PXN-CB1 Buttonboard — 8 Haupttasten (BTN-Codes von event7) ────────
[[bindings]]
key    = "BTN_MISC"
action = "gaming"

[[bindings]]
key    = "BTN_1"
action = "viz_psychedelic"

[[bindings]]
key    = "BTN_2"
action = "viz_crt"

[[bindings]]
key    = "BTN_3"
action = "viz_eye"

[[bindings]]
key    = "BTN_4"
action = "kitt"

[[bindings]]
key    = "BTN_5"
action = "home"

[[bindings]]
key    = "BTN_6"
action = "campfire"

[[bindings]]
key    = "BTN_7"
action = "error"      # Taste 8 (E-TALK): Systemfehler-Visualizer; "status" weiter über scripts/kittctl status

[[bindings]]
key    = "BTN_8"
action = "quit"

[[bindings]]
key    = "BTN_9"
action = "planeten"

# ── Cherry-Tastatur ESC (Entwicklung/Notfall) ──────────────────────────
[[bindings]]
key    = "KEY_ESC"
action = "quit"
