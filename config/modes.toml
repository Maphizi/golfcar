# Modi des Launchers. Jeder Modus ist ein eigener Prozess.
# Platzhalter: {python} = Interpreter des Launchers, {root} = Projektverzeichnis, {home} = Home-Verzeichnis
# stop_timeout: Sekunden zwischen SIGTERM und SIGKILL beim Umschalten

[modes.home]
label = "HOME"
command = ["{python}", "-m", "launcher.home_screen"]
cwd = "{root}"
stop_timeout = 2

[modes.gaming]
label = "RETRO GAMING"
# Phase 3: wird auf EmulationStation umgestellt
command = ["{python}", "-m", "launcher.placeholder", "F1  RETRO GAMING"]
cwd = "{root}"
stop_timeout = 8

[modes.viz_psychedelic]
label = "PSYCHEDELIC"
command = ["{python}", "-m", "launcher.placeholder", "F2  PSYCHEDELIC"]
cwd = "{root}"
stop_timeout = 3

[modes.viz_crt]
label = "CRT SCOPE"
command = ["{python}", "-m", "launcher.placeholder", "F3  CRT SCOPE"]
cwd = "{root}"
stop_timeout = 3

[modes.viz_eye]
label = "DIGITAL EYE"
command = ["{python}", "-m", "launcher.placeholder", "F4  DIGITAL EYE"]
cwd = "{root}"
stop_timeout = 3

[modes.kitt]
label = "KITT"
command = ["{python}", "-m", "launcher.placeholder", "F5  KITT"]
cwd = "{root}"
stop_timeout = 5
