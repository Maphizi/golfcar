# Modi des Launchers. Jeder Modus ist ein eigener Prozess.
# Platzhalter: {python} = Interpreter des Launchers, {root} = Projektverzeichnis, {home} = Home-Verzeichnis
# stop_timeout: Sekunden zwischen SIGTERM und SIGKILL beim Umschalten

[modes.boot]
label = "BOOT"
command = ["{python}", "-m", "launcher.boot_screen"]
cwd = "{root}"
stop_timeout = 1

[modes.home]
label = "TAXISTAND"
command = ["{python}", "-m", "visualizers.engine", "taxi"]
cwd = "{root}"
stop_timeout = 2

[modes.menu]
label = "HAUPTMENÜ (ALT)"
command = ["{python}", "-m", "launcher.home_screen"]
cwd = "{root}"
stop_timeout = 2

[modes.gaming]
label = "HOLO-ARCADE"
command = ["{root}/scripts/run_gaming.sh"]
cwd = "{home}"
stop_timeout = 8
# Backend siehe scripts/run_gaming.sh: "xwayland" (Standard) oder "wayland"
env = { KITT_GAMING_BACKEND = "xwayland" }

[modes.viz_psychedelic]
label = "HYPERRAUM"
command = ["{python}", "-m", "visualizers.engine", "psychedelic"]
cwd = "{root}"
stop_timeout = 3

[modes.trip]
label = "WALDTRESEN"
command = ["{python}", "-m", "visualizers.engine", "trip"]
cwd = "{root}"
stop_timeout = 3

[modes.viz_crt]
label = "ZIELCOMPUTER"
command = ["{python}", "-m", "visualizers.engine", "crt"]
cwd = "{root}"
stop_timeout = 3

[modes.viz_eye]
label = "TAKTIK-SCANNER"
command = ["{python}", "-m", "visualizers.engine", "eye"]
cwd = "{root}"
stop_timeout = 3

[modes.kitt]
label = "BORDCOMPUTER"
command = ["{python}", "-m", "kitt.ui"]
cwd = "{root}"
# Beim Beenden müssen whisper-server und llama-server mit sterben; sie laufen in derselben Prozessgruppe
stop_timeout = 8
[modes.campfire]
label = "LAGERFEUER / AUSSENPOSTEN"
command = ["{python}", "-m", "visualizers.engine", "campfire"]
cwd = "{root}"
stop_timeout = 3

[modes.planeten]
label = "PLANETEN-FLUG"
command = ["{python}", "-m", "visualizers.scenes.planets"]
cwd = "{root}"
stop_timeout = 3

[modes.error]
label = "SYSTEMFEHLER"
command = ["{python}", "-m", "visualizers.engine", "error"]
cwd = "{root}"
stop_timeout = 3

[modes.slots]
label = "SPACE-SLOTS"
command = ["{python}", "-m", "visualizers.engine", "slots"]
cwd = "{root}"
stop_timeout = 3

[modes.news]
label = "GALAKTISCHE NACHRICHTEN"
command = ["{python}", "-m", "kitt.news"]
cwd = "{root}"
# llama-server läuft in derselben Prozessgruppe und stirbt mit
stop_timeout = 8

[modes.droid]
label = "BORD-DROIDE BIBO"
command = ["{python}", "-m", "kitt.droid"]
cwd = "{root}"
stop_timeout = 8

[modes.blackhole]
label = "SCHWARZES LOCH"
command = ["{python}", "-m", "visualizers.engine", "blackhole"]
cwd = "{root}"
stop_timeout = 3

[modes.hal]
label = "HAL 3000"
command = ["{python}", "-m", "kitt.hal"]
cwd = "{root}"
stop_timeout = 8
