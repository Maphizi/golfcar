# Themen des Taxistands (Taste 1, D-Pad links/rechts, Start). Die Wahl steht in logs/theme.txt und geht
# als KITT_THEME an jeden Modus (launcher/theme.py). Jedes Thema bringt seinen Bildsatz unter assets/taxi/<dir>/:
#   mission.png  Logo links (RGBA), sprites.png Figuren-Atlas 8x3 à 96 px (RGBA), driver.png Fahrerfoto (quadratisch)
#   erzeugen mit: .venv/bin/python scripts/taxi_sprites.py LOGO BOGEN --out assets/taxi/<dir>
# eyes / eye_r: Augenmitten und -radius im Fahrerfoto (Anteile, y von unten) für die Kreisel beim Beat.
# color_a: Farbe des Taxischeins, color_b: Zweitfarbe, tint: Duotone-Farbe (nur ohne driver.png).
# default = true: gilt, solange nichts gewählt wurde. content: Inhaltssatz der Modi.
# modes = { <modus> = "<ersatz>" }: in diesem Thema startet die Taste des Modus stattdessen den Ersatzmodus.

[[themes]]
name = "spacetaxi"
default = true
content = "space"
title = "PER ANHALTER DURCH DIE GALAXIS"
tagline = "DER NEUE WETTLAUF ZUM LOCH 19"
dir = "space"
driver_title = "SPACE TAXI DRIVER"
eyes = [[0.425, 0.655], [0.573, 0.655]]
eye_r = 0.03
missions = [
  "KEINE PANIK. HANDTUCH DABEI.", "42 FAHRGÄSTE BIS LOCH 19", "VOGONEN-LYRIK VERMEIDEN",
  "ANHALTER AUFNEHMEN, DAUMEN PRÜFEN", "RESTAURANT AM ENDE DES UNIVERSUMS, TISCH FÜR ZWEI",
  "UNWAHRSCHEINLICHKEIT AUF 1 ZU 2^276709", "DELFINE GRÜSSEN, FISCH NICHT VERGESSEN",
  "TEE. RICHTIGEN TEE.", "BABELFISCH IM OHR, BESCHWERDEN AUF ALTVOGONISCH",
]
cover_style = 4
color_a = [0.95, 0.80, 0.25]
color_b = [0.15, 0.45, 0.85]
tint = [0.95, 0.75, 0.25]

