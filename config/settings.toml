# KITT-Cart – allgemeine Einstellungen

[launcher]
# ESC beendet den gesamten Launcher. Im Appliance-Betrieb (systemd) bleibt der Dienst dann aus
# (schwarzer Bildschirm) bis zum Neustart; für den Alltag auf false setzen.
dev_emergency_exit = true
# Boot-Sequenz vor dem Home-Screen (Sekunden, 0 = aus) und Ansagen (config/announce.toml)
boot_seconds = 4
announce = true
# Alle n Sekunden Temperatur/Last/RAM ins Launcher-Log schreiben
status_interval = 60
# Nach dem Start die KITT-Modelle (Whisper, Qwen, VAD, Piper) im Hintergrund in den RAM-Cache lesen.
# Kostet einmalig ca. 2 GB Cache, F5 ist dann in ~20 s statt ~90 s bereit.
prefetch_models = true
# Name des Piloten für Startbildschirm und Figuren (Foto: assets/pilot.png, siehe scripts/pilot_cutout.py)
pilot_name = "MARC"
# Größeres Sprachmodell nur für HAL (leer = das aus kitt.toml). Qwen3.5-4B antwortet deutlich klüger,
# braucht aber auf dem Pi etwa doppelt so lange (ca. 2,5 statt 5 Wörter pro Sekunde).
smart_model = ""

[sfx]
# Hupe und Effekte je Thema (Aktionen "horn" und "fx" in config/keymap.toml), Klänge aus scripts/sfx_build.py
enabled = true
volume = 1.0

[attract]
# Vorführmodus: nach idle_minutes ohne Eingabe wechselt der Launcher alle every_seconds durch die Modi des Themas
# (Tasten 2-7); jede Eingabe beendet ihn. Nicht im Spielmodus (gaming) und nicht auf dem Startbildschirm.
enabled = true
idle_minutes = 5
every_seconds = 180

[volume]
# Grundlautstärke ALLER Sprecher (KITT, HAL, BIBO, Ansagen) im Verhältnis zur Musik: 1.0 = wie gerendert, 0.5 = halb
# so laut (-6 dB). Der Drehknopf (unten) regelt zusätzlich darauf.
voice_gain = 0.5
# Drehknopf (ABS-Achse) regelt die Lautstärke der STIMME (KITT, HAL, BIBO, Ansagen), nicht die Musik.
# axis leer = nur beobachten: der Launcher meldet im Log, welche Achsen sich bewegen ("Achse ABS_Z = 128 ...");
# die des Drehknopfs hier eintragen (z. B. "ABS_Z"). target = "sink" regelt stattdessen den ganzen Ausgang.
enabled = true
rel = true
step = 5
start_percent = 100
axis = ""
target = "voice"
min_percent = 0
max_percent = 130
invert = false
# Sprechmodus bei HAL (Sprechtaste): Musik auf diesen Anteil der aktuellen Lautstärke absenken
duck_percent = 25

[buttons]
# Unbenannte HID-Codes des PXN-CB1 (Gamepad-Interface). Welche Taste welchen Code sendet und ob eine
# Taste von selbst dauernd sendet, zeigt:  scripts/input_monitor.py 10
start_code = 266         # dicker Startknopf -> ENTER (Auswahl, Losfliegen)
kipp_code = 267          # Kippschalter -> SPACE (AN) / BACKSPACE (AUS); Navigationscomputer scharf/stoppen
kipp_mode = "toggle"     # "toggle": jeder Druck wechselt AN/AUS. "state": value 1 = AN, 0 = AUS (echter Schalter)
talk_code = 0            # Sprechtaste -> F15 (HAL: Musik leise, Mikrofon an); 0 = keine. Alternativ keymap.toml action = "talk"
attract_code = 275       # Autopilot-Kippschalter (echter Schalter, state): 1 = unten/AN, 0 = oben/AUS
horn_code    = 269       # Hupe-Kippschalter (fällt in die Mitte zurück), Seite 1: 1 = gedrückt -> Hupe, 0 = zurück
horn2_code   = 0         # Hupe, Seite 2 -> zweiter Ton (<thema>_horn2.wav); Code aus dem Launcher-Log "Taste ohne Belegung", 0 = keine
# Weitere Kippschalter (unten neben dem Autopilot): in config/keymap.toml mit code = N belegen, je Stellung eine Aktion
# (on = "down" beim Umlegen nach unten, on = "up" beim Zurücklegen); Codes aus dem Launcher-Log "Taste ohne Belegung".
debounce_ms = 300        # gleiche Taste innerhalb dieser Zeit nochmal = ignorieren (Prellen, Dauerfeuer)

[hal]
# mic = false: HAL hört nicht zu, es wird kein Mikrofon geöffnet und die Musik nie abgesenkt (ein
# Bluetooth-Headset bleibt so immer im Stereo-Musikprofil). HAL spricht trotzdem von selbst, Start = sagt etwas.
# true: Sprechtaste schaltet Musik leise + Mikrofon an (braucht ein Mikrofon, das nicht das Headset ist).
mic = false
# Sprechmodus (Musik leise, Mikrofon an) schaltet die Sprechtaste um: eine Taste des Boards in
# config/keymap.toml auf action = "talk" legen (z. B. [[bindings]] code = 268 / action = "talk");
# der Launcher schickt dann F15 an HAL. Zum Testen: scripts/kittctl talk
kipp_talk = false        # true = zusätzlich wie früher Kippschalter unten = Sprechmodus an, oben = aus
talk_timeout = 150       # Sekunden ohne Gespräch, nach denen der Sprechmodus von selbst endet (0 = nie)

[music]
# Musik über mpv (scripts/music.sh, Steuer-Socket /tmp/mpv.sock). Der zweite Drehknopf regelt nur mpv:
# Consumer-Tasten (Lauter/Leiser) werden immer erkannt; rel = true nimmt zusätzlich REL_MISC-Schritte,
# axis = "ABS_..." eine absolute Achse. step = Prozent je Schritt.
knob_enabled = true
socket = "/tmp/mpv.sock"
step = 5
rel = false
axis = ""
max_percent = 100
start_percent = 70

[display]
# 0 = native Auflösung des Displays (1920x1080 am Ninja V)
width = 0
height = 0
vsync = true
home_fps = 30
# "auto" = SDL wählt (Wayland unter labwc). Alternativ "wayland", "x11", "kmsdrm".
sdl_videodriver = "auto"

[logging]
# Verzeichnis für Logs. Relativ zum Projekt oder absolut.
# Um SD-Schreibzugriffe zu sparen, kann hier später ein tmpfs stehen, z. B. "/run/user/1000/kitt-logs".
dir = "logs"
level = "INFO"
