# KITT Sprachassistent: STT (Phase 5), LLM (Phase 6), TTS (Phase 7)
# Pfade: ~ wird expandiert, {root} = Projektverzeichnis

[stt]
whisper_dir = "{root}/vendor/whisper.cpp"
models_dir = "{root}/models"
# Nach dem Benchmark (scripts/stt_bench.sh) hier das gewählte Modell eintragen
model = "ggml-small-q5_1.bin"
language = "de"
threads = 4
port = 8178
# Audio-Kontext des Encoders: 0 = voll (30 s). 768 halbiert die Encoder-Zeit bei Äußerungen bis ~15 s.
audio_ctx = 512
# Greedy-Decoding für geringste Latenz
beam_size = 1
best_of = 1
# Initialer Prompt lenkt Schreibweise/Sprache (kein Inhalt, nur Stil-Hinweis)
prompt = "KITT."

[stt.bench]
# Kandidaten für scripts/stt_bench.sh, alle multilingual (für Deutsch nötig)
models = ["ggml-base.bin", "ggml-small-q5_1.bin"]

[vad]
# auto = Silero (onnxruntime), Fallback energiebasiert | silero | energy
backend = "auto"
model = "{root}/models/silero_vad.onnx"
# Silero-Wahrscheinlichkeit, ab der Sprache beginnt / unter der sie endet
start_threshold = 0.6
end_threshold = 0.35
# Sprache muss so lange anhalten, bis "LISTENING" beginnt (Vielfache von 32 ms)
start_ms = 64
# Stille, nach der die Äußerung abgeschlossen ist
end_silence_ms = 700
# Audio vor dem Sprachbeginn, das mitgeschickt wird
pre_roll_ms = 300
min_speech_ms = 300
max_speech_ms = 12000

[llm]
llama_dir = "{root}/vendor/llama.cpp"
models_dir = "{root}/models"
# Nach dem Benchmark (scripts/llm_bench.sh) hier das gewählte Modell eintragen
model = "Qwen3.5-2B-Q4_K_M.gguf"
port = 8179
threads = 4
# Kontextfenster: System-Prompt + wenige Dialogrunden reichen
ctx = 2048
# Antworten kurz halten
max_tokens = 60
temperature = 0.7
top_p = 0.8
repeat_penalty = 1.05
# Wie viele vergangene Dialogrunden KITT im Kontext behält
history_turns = 4
system_prompt = "{root}/kitt/personality/system_prompt.txt"

[llm.bench]
# Kandidaten: Datei -> Download-URL. Alle Instruct/Chat, Q4-quantisiert.
# Qwen3/Qwen3.5-Modelle laufen mit abgeschaltetem Thinking (--reasoning-budget 0, enable_thinking=false).
prompts = "{root}/kitt/personality/bench_prompts.txt"

[[llm.bench.models]]
file = "qwen2.5-1.5b-instruct-q4_k_m.gguf"
url = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"

[[llm.bench.models]]
file = "Qwen3.5-0.8B-Q4_K_M.gguf"
url = "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf"

[[llm.bench.models]]
file = "Qwen3.5-2B-Q4_K_M.gguf"
url = "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf"

[[llm.bench.models]]
file = "Qwen3.5-4B-Q4_K_M.gguf"
url = "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"

[tts]
# Piper (pip-Paket piper-tts). Stimme: deutsch, männlich, ruhig. Keine Imitation eines Schauspielers.
voices_dir = "{root}/models/piper"
voice = "de_DE-thorsten-medium"
# Alternativen (werden von scripts/setup_phase7.sh mitgeladen, wenn in bench_voices):
bench_voices = ["de_DE-thorsten-medium", "de_DE-thorsten-high"]
# Sprechtempo: >1 langsamer, <1 schneller
length_scale = 1.0
# Spielt das Audio um diesen Faktor langsamer ab (tiefere Stimme). 1.0 = aus, 0.94 ≈ ein Halbton tiefer.
pitch_factor = 0.94
# Pause zwischen Sätzen in Sekunden
sentence_silence = 0.15
# Lautstärke 0..1
volume = 1.0
# Wiedergabe: auto = pw-play (PipeWire), Fallback aplay (ALSA/pipewire-alsa). Ziel aus config/audio.toml [output].
player = "auto"

[voice]
# Nach dem Sprechen so lange nicht zuhören (Nachhall, Lautsprecher -> Mikrofon)
resume_delay_ms = 400
# Transkripte, die whisper bei Stille/Rauschen gern halluziniert, werden ignoriert
ignore_phrases = ["untertitel", "zdf", "vielen dank", "copyright", "amara.org", "www."]
# Mindestanzahl Wörter, damit eine Äußerung an das LLM geht
min_words = 2
# Wenn true, antwortet KITT nur, wenn "kitt" im Transkript vorkommt (Anrede). Sonst auf alles.
require_name = false
# Höchstens so viele Sätze sprechen, danach wird die Generierung abgebrochen
max_sentences = 3
# Floskeln, die am Satzanfang gestrichen werden
strip_openers = ["Natürlich!", "Natürlich,", "Natürlich.", "Gerne!", "Gerne,", "Gerne.", "Kein Problem!", "Kein Problem,", "Selbstverständlich!", "Selbstverständlich,", "Klar!", "Klar,", "Okay,", "Ok,"]

[ui]
# Readout-Zeile mit letztem Transkript / gesprochenem Satz (kein Chatfenster, eine Zeile)
show_text = true
# Sekunden, die die Zeile nach einer Antwort stehen bleibt
text_hold_s = 8
# Begrüßung nach dem Laden (leer = keine)
greeting = "KITT online."
