# Gemeinsame GL-Visualizer-Engine (F2–F4)

[engine]
fps_cap = 60
# alle n Sekunden FPS und Audio-Pegel ins Log
log_interval = 10
# Shader-Dateien bei Änderung automatisch neu laden (Entwicklung)
hot_reload = true
# Ziel-Auflösung der GL-Fläche: 0 = Display
width = 0
height = 0

# render_scale < 1 rendert in einen kleineren Framebuffer und skaliert hoch (spart GPU-Zeit).
[scenes.psychedelic]
shader = "navcomputer"     # Navigationscomputer; Alternativen: "hyperspace", klassisch "psychedelic"
controller = "navcomputer"
render_scale = 0.55        # auf dem Pi lief 0.75 im Hyperraum nur mit 25 bis 29 fps
launch_seconds = 3.5
cruise_seconds = 14.0
arrive_seconds = 4.0

[scenes.crt]
shader = "target"          # Space-Thema; klassisch: "crt"
render_scale = 1.0

[scenes.eye]
shader = "tactical"        # Space-Thema; klassisch: "eye"
render_scale = 0.85

[scenes.kitt]
shader = "shipcomputer"    # Space-Thema; klassisch: "kitt"
render_scale = 1.0

[scenes.campfire]
shader = "campfire"
controller = "campfire"   # Beduinen-Abend: Lauf des Abends, Wind, Karawane, Musikhüllkurven
render_scale = 0.7        # weiche Zeichnung; bei unter 45 fps auf dem Pi 0.55
cycle_minutes = 22        # ein Abend (Dämmerung, Nacht, Morgengrauen) in Minuten
start_phase = 0.0         # 0 = Start in der Abenddämmerung, 0.3 = mitten in der Nacht

[scenes.error]
shader = "error"
controller = "error"
render_scale = 0.6

[scenes.slots]
shader = "slots"
controller = "slots"
render_scale = 0.6

[scenes.blackhole]
shader = "blackhole"
controller = "blackhole"
render_scale = 0.35       # Strahlverfolgung, teuer: Pi 5 schafft 0.5 mit 64 Schritten nur 9 fps

[scenes.taxi]
shader = "taxi"
controller = "taxi"
render_scale = 0.8

[scenes.hal]
shader = "hal"
render_scale = 0.75

[scenes.droid]
shader = "droid"
render_scale = 0.6

[scenes.newsroom]
shader = "newsroom"
render_scale = 0.7

[scenes.hyperspace]
shader = "hyperspace"
render_scale = 0.75

[scenes.target]
shader = "target"
render_scale = 1.0

[scenes.tactical]
shader = "tactical"
render_scale = 1.0

[scenes.navcomputer]
shader = "navcomputer"
controller = "navcomputer"
render_scale = 0.75
