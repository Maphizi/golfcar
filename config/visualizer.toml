# Gemeinsame GL-Visualizer-Engine (F2–F4)

[engine]
fps_cap = 60
# alle n Sekunden FPS und Audio-Pegel ins Log
log_interval = 10
# Shader-Dateien bei Änderung automatisch neu laden (Entwicklung)
hot_reload = true
# Ziel-Auflösung der GL-Fläche: 0 = Display
width = 0
height = 0

# render_scale < 1 rendert in einen kleineren Framebuffer und skaliert hoch (spart GPU-Zeit).
[scenes.psychedelic]
shader = "navcomputer"     # Navigationscomputer; Alternativen: "hyperspace", klassisch "psychedelic"
controller = "navcomputer"
render_scale = 0.38        # auf dem Pi lief 0.75 im Hyperraum nur mit 25 bis 29 fps
launch_seconds = 3.5
cruise_seconds = 14.0
arrive_seconds = 4.0

[scenes.crt]
shader = "target"          # Space-Thema; klassisch: "crt"
render_scale = 1.0

[scenes.eye]
shader = "tactical"        # Space-Thema; klassisch: "eye"
render_scale = 0.85

[scenes.kitt]
shader = "shipcomputer"    # Space-Thema; klassisch: "kitt"
render_scale = 1.0

[scenes.campfire]
shader = "campfire"
controller = "campfire"   # Cinemagraph: Foto der Szene + echte Flammen aus dem Spritesheet
render_scale = 0.85       # Foto soll scharf bleiben; bei unter 45 fps auf dem Pi 0.7
plate = "scene.png"       # assets/campfire/: Szene (vom Piloten erzeugt)
flames = "flames.png"     # assets/campfire/: Flammen-Spritesheet, Zellen Spalten x Zeilen
flame_frames = [8, 5]
flame_fps = 12
fire = [0.44, 0.23, 0.30, 0.36]   # Feuerstelle im Bild: x, y des Flammenfußes (von unten), Breite, Höhe (Anteile)
cycle_minutes = 22        # Lauf des Abends als Farbstimmung in Minuten
start_phase = 0.3         # 0 = Abendrot, 0.3 = Nacht (das Foto ist eine Nachtszene), 0.9 = Morgengrauen

[scenes.error]
shader = "error"
controller = "error"
render_scale = 0.6

[scenes.slots]
shader = "slots"
controller = "slots"
render_scale = 0.6

[scenes.blackhole]
shader = "blackhole"
controller = "blackhole"
render_scale = 0.35       # Strahlverfolgung, teuer: Pi 5 schafft 0.5 mit 64 Schritten nur 9 fps

[scenes.trip]
shader = "trip"
controller = "trip"        # Waldtresen: Wesen essen, psychedelische Reise (Thema Power of the Green)
render_scale = 0.6

[scenes.pond]
shader = "pond"
controller = "pond"        # Moorsee (Thema Power of the Green, Gegenstück zum Schwarzen Loch)
render_scale = 0.6
vortex = [0.56, 0.30]      # Strudelmitte im Bild (Anteile, y von unten)
water = [0.14, 0.52, 0.18, 0.92]   # Wasserfläche: y unten, y oben, x links, x rechts

[scenes.taxi]
shader = "taxi"
controller = "taxi"
render_scale = 0.8
# Bildsätze, Augenpositionen und Aufträge je Thema: config/themes.toml

[scenes.hal]
shader = "hal"
render_scale = 0.75

[scenes.droid]
shader = "droid"
render_scale = 0.6

[scenes.newsroom]
shader = "newsroom"
render_scale = 0.7

[scenes.hyperspace]
shader = "hyperspace"
render_scale = 0.75

[scenes.target]
shader = "target"
render_scale = 1.0

[scenes.tactical]
shader = "tactical"
render_scale = 1.0

[scenes.navcomputer]
shader = "navcomputer"
controller = "navcomputer"
render_scale = 0.75

[scenes.woodeye]
shader = "woodeye"
controller = "woodeye"     # Das Auge des Waldes (Thema Power of the Green, Gegenstück zu HAL 3000)
render_scale = 0.6
eye = [0.511, 0.722, 0.175] # Augenmitte x, y (von unten), Breite (Bildanteile)

[scenes.forestslots]
shader = "forestslots"
controller = "forestslots"   # Der Pilzautomat (Thema Power of the Green, Gegenstück zur Space-Slotmaschine)
render_scale = 0.6
windows = [[0.335, 0.418], [0.439, 0.528], [0.550, 0.636]]   # x-Bereich der drei Fenster (Bildanteile)
window_y = [0.447, 0.681]                                     # y-Bereich der Fenster (von unten)

[scenes.hearttree]
shader = "hearttree"
controller = "hearttree"   # Der Herzbaum (Thema Power of the Green, Gegenstück zum Lagerfeuer)
render_scale = 0.6
trunk = [0.52, 0.42]       # Stammmitte (Atmen, Nahaufnahme)
cycle_minutes = 6          # Minuten je Jahreszeit, wenn niemand den Knüppel bewegt

[scenes.overdose]
shader = "overdose"
controller = "overdose"    # Die Überdosis (Thema Power of the Green, Gegenstück zum Systemfehler)
render_scale = 0.6
