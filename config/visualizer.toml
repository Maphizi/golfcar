# Gemeinsame GL-Visualizer-Engine (F2–F4)

[engine]
fps_cap = 60
# alle n Sekunden FPS und Audio-Pegel ins Log
log_interval = 10
# Shader-Dateien bei Änderung automatisch neu laden (Entwicklung)
hot_reload = true
# Ziel-Auflösung der GL-Fläche: 0 = Display
width = 0
height = 0

# render_scale < 1 rendert in einen kleineren Framebuffer und skaliert hoch (spart GPU-Zeit).
[scenes.psychedelic]
shader = "navcomputer"     # Navigationscomputer; Alternativen: "hyperspace", klassisch "psychedelic"
controller = "navcomputer"
render_scale = 0.38        # auf dem Pi lief 0.75 im Hyperraum nur mit 25 bis 29 fps
launch_seconds = 3.5
cruise_seconds = 14.0
arrive_seconds = 4.0

[scenes.crt]
shader = "target"          # Space-Thema; klassisch: "crt"
render_scale = 1.0

[scenes.eye]
shader = "tactical"        # Space-Thema; klassisch: "eye"
render_scale = 0.85

[scenes.kitt]
shader = "shipcomputer"    # Space-Thema; klassisch: "kitt"
render_scale = 1.0

[scenes.campfire]
shader = "campfire"
controller = "campfire"   # Rast am Rand der Galaxis: Foto ohne Flammen + Flammenbögen (klein/mittel/groß/blau)
render_scale = 0.85       # Foto soll scharf bleiben; bei unter 45 fps auf dem Pi 0.7
fire = [0.465, 0.20, 0.19] # Flammenfuß x, y (von unten), Zellbreite (Anteil der Bildbreite; Zelle ist 1:2 hoch)
kettle = [0.44, 0.44]     # Tülle des Kessels (Dampf)
kettle_box = [0.44, 0.419, 0.034, 0.051]   # Kesselbauch im Foto (Mitte x, y von unten, Radius x, y): bleibt vor den Flammen
# Prüfen auf dem Gerät: KITT_CAMPFIRE_CAL=1 python -m visualizers.engine campfire --test-signal zeigt Flammenzelle (rot) und Kessel (blau)
taxi = [0.02, 0.50, 0.30, 0.62]   # Rechteck der Taxi-Lichter (x0, y0, x1, y1, y von unten)
horizon = 0.57            # ab hier Himmel (Sterne, Polarlicht, Aufgang)
alien = [0.72, 0.21, 0.09]        # Alien: x, Fußlinie, Größe
mallow = [0.56, 0.46]     # Spitze des Marshmallow-Stocks über dem Feuer
cycle_minutes = 60        # Aufgang des Planeten (Himmel steigt) in Minuten

[scenes.error]
shader = "error"
controller = "error"
render_scale = 0.6

[scenes.slots]
shader = "slots"
controller = "slots"            # ORBIT, COMIC, WAHNSINN (3 Walzen); Rahmen assets/slots/space_frame.png optional, sonst Blende
render_scale = 0.6
area = [0.195, 0.08, 0.89, 0.942]   # Walzenfläche = Schwarzfläche des Rahmens (x0, y0, x1, y1, y von unten)

[scenes.blackhole]
shader = "blackhole"
controller = "blackhole"
render_scale = 0.35       # Strahlverfolgung, teuer: Pi 5 schafft 0.5 mit 64 Schritten nur 9 fps

[scenes.trip]
shader = "trip"
controller = "trip"        # Waldtresen: Wesen essen, psychedelische Reise (Thema Power of the Green)
render_scale = 0.6

[scenes.pond]
shader = "pond"
controller = "pond"        # Moorsee (Thema Power of the Green, Gegenstück zum Schwarzen Loch)
render_scale = 0.6
vortex = [0.56, 0.30]      # Strudelmitte im Bild (Anteile, y von unten)
water = [0.14, 0.52, 0.18, 0.92]   # Wasserfläche: y unten, y oben, x links, x rechts

[scenes.taxi]
shader = "taxi"
controller = "taxi"
render_scale = 0.8
# Bildsätze, Augenpositionen und Aufträge je Thema: config/themes.toml

[scenes.hal]
shader = "hal"
render_scale = 0.75

[scenes.droid]
shader = "droid"
render_scale = 0.6

[scenes.newsroom]
shader = "newsroom"
render_scale = 0.7

[scenes.hyperspace]
shader = "hyperspace"
render_scale = 0.75

[scenes.target]
shader = "target"
render_scale = 1.0

[scenes.tactical]
shader = "tactical"
render_scale = 1.0

[scenes.navcomputer]
shader = "navcomputer"
controller = "navcomputer"
render_scale = 0.75

[scenes.woodeye]
shader = "woodeye"
controller = "woodeye"     # Das Auge des Waldes (Thema Power of the Green, Gegenstück zu HAL 3000)
render_scale = 0.6
eye = [0.511, 0.722, 0.175] # Augenmitte x, y (von unten), Breite (Bildanteile)

[scenes.forestslots]
shader = "slots"
controller = "forestslots"   # Pilzautomat, Tiere des Waldes, Waldgeister (Thema Power of the Green), gemeinsamer Shader "slots"
render_scale = 0.6
area = [0.161, 0.093, 0.834, 0.861]   # Walzenfläche = Schwarzfläche des Rahmens (x0, y0, x1, y1, y von unten)

[scenes.hearttree]
shader = "hearttree"
controller = "hearttree"   # Der Herzbaum (Thema Power of the Green, Gegenstück zum Lagerfeuer)
render_scale = 0.6
trunk = [0.52, 0.42]       # Stammmitte (Atmen, Nahaufnahme)
cycle_minutes = 6          # Minuten je Jahreszeit, wenn niemand den Knüppel bewegt

[scenes.overdose]
shader = "overdose"
controller = "overdose"    # Die Überdosis (Thema Power of the Green, Gegenstück zum Systemfehler)
render_scale = 0.6

# ── Thema CYBERPUNK (docs/cyber_plan.md) ──────────────────────────────────────
[scenes.neonrace]
shader = "neonrace"
controller = "neonrace"    # Neonfahrt (Cyber-Taste 2)
render_scale = 0.6
vanish = [0.5, 0.5]        # Fluchtpunkt der Straße
district_every = [70, 120] # Sekunden Fahrt zwischen zwei Stadtteilwechseln (Lichttor)

[scenes.core]
shader = "core"
controller = "core"        # Der Kern (Cyber-Taste 3)
render_scale = 0.6
center = [0.5, 0.56]       # Kernmitte (Anteile, y von unten)
radius = 0.13

[scenes.oracle]
shader = "oracle"
controller = "oracle"      # Das Orakel (Cyber-Taste 4)
render_scale = 0.6
frame = [0.505, 0.73, 0.27]              # Projektionsrahmen x, y, Breite
panels = [0.264, 0.757, 0.385, 0.052]    # Neontafeln: x erste, x letzte, y, Breite
mask_fit = [0.0, 0.08, 0.58]             # Maske über dem Gesicht: dx, dy, Größe (Kopf-Einheiten -1..1)
mouth = [-0.05, -0.36]                   # Mund für den Datenmüll-Schwall (Kopf-Einheiten)

[scenes.cyberslots]
shader = "slots"
controller = "cyberslots"  # Pachinko, Konzern, Netzgeister (Cyber-Taste 5), gemeinsamer Shader "slots", Rahmen assets/slots/cyber_frame.png
render_scale = 0.6
area = [0.133, 0.079, 0.866, 0.923]   # Walzenfläche = Schwarzfläche des Rahmens (x0, y0, x1, y1, y von unten)

[scenes.rooftop]
shader = "rooftop"
controller = "rooftop"     # Dachterrasse (Cyber-Taste 6)
render_scale = 0.6
skyline = 0.42             # y, ab der die Stadt beginnt
cycle_minutes = 5          # Minuten je Wetter

[scenes.blackice]
shader = "blackice"
controller = "blackice"    # Black Ice (Cyber-Taste 7)
render_scale = 0.6

# ── Thema ZURÜCK IN DIE ZUKUNFT (docs/future_plan.md) ─────────────────────────
[scenes.timejump]
shader = "timejump"
controller = "timejump"    # Zeitsprung (Zukunft-Taste 2)
render_scale = 0.6
vanish = [0.5, 0.42]       # Fluchtpunkt der Straße (Anteile, y von unten)
windshield = [0.0, 1.0, 0.45, 1.0]   # Scheibenbereich im Cockpitbild: x0, x1, y0, y1 (y von unten)
cockpit_drop = 0.08        # Cockpit nach unten schieben: mehr Scheibe, kleinere Armaturen

[scenes.flux]
shader = "flux"
controller = "flux"        # Fluxkompensator (Zukunft-Taste 3)
render_scale = 0.6
center = [0.5, 0.5]        # Mitte des Y (Anteile, y von unten)
radius = 0.12
base_zoom = 0.5            # Grundnähe (0 = ganzes Foto, 1 = Nahaufnahme wie Kippschalter AN)

[scenes.clocktower]
shader = "clocktower"
controller = "clocktower"  # Uhrturm (Zukunft-Taste 4)
render_scale = 0.6
clock = [0.667, 0.824, 0.045]            # Zifferblatt x, y, Radius (am Foto gemessen)
windows = [0.186, 0.613, 0.268, 0.044]   # Schaufenster: x erste, x letzte (8 von 9, das neunte liegt unter dem Turm), y Mitte, Breite
cable = [0.714, 0.764, 0.922, 0.463]     # Kabel Turm -> Laterne: x0, y0, x1, y1

[scenes.almanacslots]
shader = "slots"
controller = "almanacslots"   # Almanach, Wilder Westen, Zukunft 2015 (Zukunft-Taste 5), gemeinsamer Shader "slots", Rahmen future_frame.png
render_scale = 0.6
area = [0.165, 0.057, 0.832, 0.896]   # Walzenfläche = Schwarzfläche des Rahmens (x0, y0, x1, y1, y von unten)

[scenes.square]
shader = "square"
controller = "square"      # Marktplatz (Zukunft-Taste 6)
render_scale = 0.6
clock = [0.53, 0.82]       # Uhrturm (Blitzziel, Nahaufnahme) x, y von unten – Standard, wenn clocks fehlt
clocks = [[0.577, 0.829], [0.501, 0.824], [0.509, 0.861], [0.541, 0.785]]   # Zifferblatt je Epoche 1885, 1955, 1985, 2015
grounds = [0.26, 0.35, 0.41, 0.35]   # Oberkante des Platzes (Boden) je Epoche
cycle_minutes = 4          # Minuten je Epoche

[scenes.paradox]
shader = "paradox"
controller = "paradox"     # Paradoxon (Zukunft-Taste 7)
render_scale = 0.6

# ── Startbildschirm (Modus boot) ──────────────────────────────────────────────
[scenes.splash]
shader = "splash"
controller = "splash"      # Titelbild bis zum ersten Tastendruck, Knopf "READY TO LIFT OFF" zur Musik
render_scale = 0.6
sun = [0.215, 0.47]        # Sonne im Bild (Anteile, y von unten)
button = [0.19, 0.86, 0.30, 0.10]   # Knopf: x, y Mitte, Breite, Höhe (im Himmel links oben, neben dem Wagen)
crop = [0.118, 0.038]      # Beschnitt des 3:2-Bilds oben, unten (Titel unten bleibt ganz)
