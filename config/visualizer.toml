# ── Thema ZURÜCK IN DIE ZUKUNFT (docs/future_plan.md) ─────────────────────────
[scenes.timejump]
shader = "timejump"
controller = "timejump"    # Zeitsprung (Zukunft-Taste 2)
render_scale = 0.6
vanish = [0.5, 0.42]       # Fluchtpunkt der Straße (Anteile, y von unten)
windshield = [0.0, 1.0, 0.36, 1.0]   # Scheibenbereich im Cockpitbild: x0, x1, y0, y1 (y von unten)

[scenes.flux]
shader = "flux"
controller = "flux"        # Fluxkompensator (Zukunft-Taste 3)
render_scale = 0.6
center = [0.5, 0.5]        # Mitte des Y (Anteile, y von unten)
radius = 0.12

[scenes.clocktower]
shader = "clocktower"
controller = "clocktower"  # Uhrturm (Zukunft-Taste 4)
render_scale = 0.6
clock = [0.667, 0.824, 0.045]            # Zifferblatt x, y, Radius (am Foto gemessen)
windows = [0.183, 0.611, 0.318, 0.039]   # Schaufenster: x erste, x letzte (8 von 9, das neunte liegt unter dem Turm), y Mitte, Breite
cable = [0.714, 0.764, 0.922, 0.463]     # Kabel Turm -> Laterne: x0, y0, x1, y1

[scenes.almanacslots]
shader = "almanacslots"
controller = "almanacslots"   # Almanach (Zukunft-Taste 5)
render_scale = 0.6
windows = [[0.316, 0.412], [0.447, 0.546], [0.581, 0.678]]
window_y = [0.414, 0.666]

[scenes.square]
shader = "square"
controller = "square"      # Marktplatz (Zukunft-Taste 6)
render_scale = 0.6
clock = [0.53, 0.82]       # Uhrturm (Blitzziel, Nahaufnahme) x, y von unten – Standard, wenn clocks fehlt
clocks = [[0.577, 0.829], [0.501, 0.824], [0.509, 0.861], [0.541, 0.785]]   # Zifferblatt je Epoche 1885, 1955, 1985, 2015
grounds = [0.26, 0.35, 0.41, 0.35]   # Oberkante des Platzes (Boden) je Epoche
cycle_minutes = 4          # Minuten je Epoche

[scenes.paradox]
shader = "paradox"
controller = "paradox"     # Paradoxon (Zukunft-Taste 7)
render_scale = 0.6
