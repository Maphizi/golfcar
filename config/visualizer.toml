# Gemeinsame GL-Visualizer-Engine (F2–F4)

[engine]
fps_cap = 60
# alle n Sekunden FPS und Audio-Pegel ins Log
log_interval = 10
# Shader-Dateien bei Änderung automatisch neu laden (Entwicklung)
hot_reload = true
# Ziel-Auflösung der GL-Fläche: 0 = Display
width = 0
height = 0

# render_scale < 1 rendert in einen kleineren Framebuffer und skaliert hoch (spart GPU-Zeit).
[scenes.psychedelic]
shader = "navcomputer"     # Navigationscomputer; Alternativen: "hyperspace", klassisch "psychedelic"
controller = "navcomputer"
render_scale = 0.55        # auf dem Pi lief 0.75 im Hyperraum nur mit 25 bis 29 fps
launch_seconds = 3.5
cruise_seconds = 14.0
arrive_seconds = 4.0

[scenes.crt]
shader = "target"          # Space-Thema; klassisch: "crt"
render_scale = 1.0

[scenes.eye]
shader = "tactical"        # Space-Thema; klassisch: "eye"
render_scale = 0.85

[scenes.kitt]
shader = "shipcomputer"    # Space-Thema; klassisch: "kitt"
render_scale = 1.0

[scenes.campfire]
shader = "campfire"
render_scale = 0.6      # Pixelraster 128 Zeilen; bei unter 45 fps auf dem Pi wieder 0.5

[scenes.error]
shader = "error"
controller = "error"
render_scale = 0.6

[scenes.slots]
shader = "slots"
controller = "slots"
render_scale = 0.6

[scenes.hyperspace]
shader = "hyperspace"
render_scale = 0.75

[scenes.target]
shader = "target"
render_scale = 1.0

[scenes.tactical]
shader = "tactical"
render_scale = 1.0

[scenes.navcomputer]
shader = "navcomputer"
controller = "navcomputer"
render_scale = 0.75
