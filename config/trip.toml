# origin: real | fiction. Reiseprofil: palette 0..5 (Farbwelt), tempo 0.4..1.6 (Geschwindigkeit),
# mirrors 4..12 (Kaleidoskop-Segmente), twist 0..1 (Spiralverdrehung), symbols: Symbolsatz
