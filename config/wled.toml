# WLED LED-Controller (Buttonboard-Beleuchtung) – Dig_Next_2 @ 192.168.2.150
# Das Board wechselt mit dem Modus; einzelne Modi schicken zusätzlich Ereignis-Profile (unten).
# Live ausprobieren, ohne etwas einzutragen:   scripts/wledctl.py set --col 0,255,0 --fx 2 --bri 200
# Profil senden:                                scripts/wledctl.py mode hal
# Alle Profile zeigen:                          scripts/wledctl.py list

[controller]
host    = "192.168.2.150"
port    = 80
timeout = 2          # Sekunden; bei Timeout weiterfahren, LEDs nicht blockieren
enabled = true

# Pro Profil: bri Helligkeit 0-255, fx Effekt-ID, col Hauptfarbe [R,G,B], col2/col3 Zweit-/Drittfarbe
# (bei vielen Effekten Hintergrund bzw. Akzent), sx Geschwindigkeit, ix Intensität, pal Palette (optional).
# fx-IDs (WLED-Standard): 0 Solid, 1 Blink, 2 Breathe, 9 Rainbow, 12 Fade, 20 Sparkle, 23 Strobe,
#   40 Scanner, 42 Fireworks, 43 Rain, 45 Fire Flicker, 59 Multi Comet, 66 Fire 2012, 76 Meteor,
#   94 Sinelon Rainbow, 162 Pulser.  Paletten (pal): 0 Standard, 1 Zufall, 2 Primär, 3 Farben 1-3.

# ── Modi ──────────────────────────────────────────────────────────────────────

[modes.boot]
bri = 200
fx  = 40          # Scanner – der klassische KITT-Scan beim Hochfahren
col = [255, 0, 0]
col2 = [8, 0, 0]
sx  = 160
ix  = 128

[modes.home]                # Taxistand / Themenwahl: Taxischild-Gelb, atmend. Das gewählte Thema
bri = 140                   # überschreibt die Farbe (Themenfarbe aus config/themes.toml).
fx  = 2           # Breathe
col = [255, 190, 0]
col2 = [40, 20, 0]
sx  = 70
ix  = 140

