# WLED LED-Controller (Buttonboard-Beleuchtung) – Dig_Next_2 @ 192.168.2.150
# Das Board wechselt mit dem Modus; einzelne Modi schicken zusätzlich Ereignis-Profile (unten).
# Live ausprobieren, ohne etwas einzutragen:   scripts/wledctl.py set --col 0,255,0 --fx 2 --bri 200
# Profil senden:                                scripts/wledctl.py mode hal
# Alle Profile zeigen:                          scripts/wledctl.py list

[controller]
host    = "192.168.2.150"
# Kanal-Remap in Software (nur, wenn die Reihenfolge NICHT in WLED gesetzt werden kann; sonst doppelt korrigiert = falsch):
# col_remap = [0, 3, 1, 2]   # [R,G,B,W] -> Drahtfolge W,R,G,B (WS2814). Standard: aus, die Reihenfolge steht in WLED
# (scripts/wled_setup.py --test --loop und WLED -> Config -> LED Preferences -> Color Order / Swap).
port    = 80
timeout = 2          # Sekunden; bei Timeout weiterfahren, LEDs nicht blockieren
enabled = true
dim     = 0.7        # Gesamthelligkeit aller Profile und des Live-Streams (0.7 = 30 % gedämpft)
# Live zur Musik (launcher/ledstream.py): jede Szene streamt 25 Bilder/s per UDP (WLED "UDP-Echtzeit empfangen" muss an sein)
realtime = true
udp_port = 21324
fps      = 25
realtime_timeout = 2  # s nach dem letzten Paket fällt WLED auf das Profil zurück (Moduswechsel)
leds     = 0         # LED-Anzahl; 0 = beim Controller nachfragen (/json/info)
reverse  = false     # Kette beginnt vorne am Cart (Index 0) und endet hinten; true, wenn umgekehrt verlegt

# Ohne pal nimmt der Launcher 2 (nur Hauptfarbe) bzw. 3 (Haupt- und Zweitfarbe), damit nie eine alte Palette
# (Regenbogen) hängen bleibt; beim ersten Senden werden zusätzliche Segmente gelöscht und Playlists gestoppt.
# Pro Profil: bri Helligkeit 0-255, fx Effekt-ID, col Hauptfarbe [R,G,B], col2/col3 Zweit-/Drittfarbe
# (bei vielen Effekten Hintergrund bzw. Akzent), sx Geschwindigkeit, ix Intensität, pal Palette (optional).
# fx-IDs (WLED-Standard): 0 Solid, 1 Blink, 2 Breathe, 9 Rainbow, 12 Fade, 20 Sparkle, 23 Strobe,
#   40 Scanner, 42 Fireworks, 43 Rain, 45 Fire Flicker, 59 Multi Comet, 66 Fire 2012, 76 Meteor,
#   94 Sinelon Rainbow, 162 Pulser.  Paletten (pal): 0 Standard, 1 Zufall, 2 Primär, 3 Farben 1-3.

