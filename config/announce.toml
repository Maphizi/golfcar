# ── Themen mit eigener Stimme und eigenen Sätzen (config/themes.toml) ──────────────────────────────────
# voice = Piper-Stimme (wird beim Rendern nachgeladen), tts = Abweichungen vom KITT-Profil in kitt.toml [tts].
# Gruppen, die hier fehlen, werden mit den Standardsätzen oben in der Themenstimme gesprochen.

[themes.spacetaxi]
# Das Space-Programm spricht mit der Stimme von HAL 3000: dieselbe Piper-Stimme wie KITT, aber langsamer, normale Tonhöhe und
# nur ein Hauch Maschine (Werte wie in kitt/hal/app.py prepare_cfg). Sätze: die Standardsätze oben.
tts = { pitch_factor = 1.0, length_scale = 1.15, robot = true, robot_freq = 35.0, robot_mix = 0.25, robot_bits = 0, robot_comb_ms = 3.0 }

