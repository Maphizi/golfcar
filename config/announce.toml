# ── Themen mit eigener Stimme und eigenen Sätzen (config/themes.toml) ──────────────────────────────────
# voice = Piper-Stimme (wird beim Rendern nachgeladen), tts = Abweichungen vom KITT-Profil in kitt.toml [tts].
# Gruppen, die hier fehlen, werden mit den Standardsätzen oben in der Themenstimme gesprochen.

[themes.green]
voice = "de_DE-pavoque-low"      # der Waldgeist: tief, langsam, ohne Roboter, mit Hall
tts = { pitch_factor = 0.88, length_scale = 1.12, robot = false, echo_ms = 170, echo_mix = 0.22, echo_decay = 0.45 }

