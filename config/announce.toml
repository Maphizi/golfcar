# Ansagen beim Moduswechsel und beim Boot. Werden einmal mit Piper vorgerendert
# (scripts/announce_build.sh -> models/announce/*.wav) und vom Launcher ohne Verzögerung abgespielt.
# Pro Eintrag wird zufällig ein Satz gewählt. Leere Liste = keine Ansage.

enabled = true

[lines]
boot = [
  "KITT-Cart online. Hyperantrieb getarnt, Schilde bereit. Pilot leider auch.",
  "Systeme hochgefahren. Droidenkern aktiv. Ich bin bereit. Du hoffentlich auch.",
  "Guten Tag, Pilot. Ich übernehme die Systeme, du das Steuer. Vorerst.",
]
gaming = [
  "Holo-Arcade. Natürlich.",
  "Spielkonsole aktiviert. Deine Reflexe werden ab jetzt protokolliert.",
  "Simulationsdeck geladen. Ich dachte, wir wären hier zum Golfen.",
]
viz_psychedelic = [
  "Hyperraum. Bitte trotzdem auf den Fairway achten.",
  "Sprung vorbereitet. Koordinaten: irgendwo zwischen Loch vier und fünf.",
]
viz_crt = [
  "Zielcomputer aktiv. Er zielt auf nichts, aber er sieht gut dabei aus.",
  "Zielerfassung. Bitte nicht auf das Clubhaus.",
]
viz_eye = [
  "Taktik-Scanner. Fremde Gleiter in Reichweite: zwei. Beide langsamer als wir.",
  "Scanner aktiv. Ich sehe alles. Das meiste ignoriere ich.",
]
campfire = [
  "Lagerfeuer am Außenposten. Ich simuliere Wärme. Mehr geht nicht.",
  "Feuer an, zwei Monde oben. Marshmallows bringst du selbst mit.",
  "Ein Lagerfeuer auf einem fremden Planeten. Romantik, technisch gelöst.",
]
home = [
  "Hauptmenü.",
  "Zurück zur Brücke. Eine deiner besseren Entscheidungen.",
]
kitt = []   # der Bordcomputer-Modus begrüßt selbst ([ui].greeting in kitt.toml)
